name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The demo site has deliberate problems, so the action is expected to fail here.
      - uses: ./
        id: lint
        continue-on-error: true
        with:
          path: test/fixtures/site
      - name: Check that the action reported problems
        run: test "${{ steps.lint.outcome }}" = "failure"
